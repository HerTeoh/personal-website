name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab, to redeploy main by hand
  # (e.g. when a deploy fails for reasons outside the code).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait instead of cancelling a deployment
# that's already in progress (as in GitHub's own Pages starter workflows).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the static site and upload it as the Pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}

      - run: touch out/.nojekyll

      - run: cp CNAME out/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Deploy in a separate job, after the build job (and its artifact upload) has finished.
  # Running deploy-pages in the same job straight after the upload intermittently failed
  # with "No artifacts named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
